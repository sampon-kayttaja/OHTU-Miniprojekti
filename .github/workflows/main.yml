name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync
      - name: Initialize Browser library
        run: uv run rfbrowser init --with-deps chromium
      - name: Run tests
        run: uv run robot --variable HEADLESS:true src/story_tests
