name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync
      - name: Initialize Browser library
        run: uv run rfbrowser init --with-deps chromium
      - name: Init database
        run: |
          uv run python3 src/db_helper.py &
          sleep 2
      - name: Start app
        run: |
          uv run flask --app src/app.py run --port 5000 &
          sleep 5
      - name: Run tests
        run: uv run robot --variable HEADLESS:true src/story_tests
